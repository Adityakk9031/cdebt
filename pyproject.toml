[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdebt"
version = "1.1.0rc8"
description = "Measure, test and pay down comprehension debt: AI-written code nobody has verifiably understood."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Aditya Kumar Singh" }]
keywords = ["comprehension debt", "ai-generated code", "code review", "git", "static analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "tree-sitter>=0.23",
  "tree-sitter-python>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
history = ["pydriller>=2.6"]
backtest = ["numpy>=1.26", "pyarrow>=15", "huggingface_hub>=0.23"]
agent = [
    "mcp>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pytest-timeout>=2.3"]

[project.urls]
Homepage = "https://github.com/Adityakk9031/cdebt"
Repository = "https://github.com/Adityakk9031/cdebt"
Issues = "https://github.com/Adityakk9031/cdebt/issues"

[project.scripts]
cdebt = "cdebt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cdebt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["posix_sandbox: needs the POSIX sandbox (skipped on Windows)"]
addopts = "-q"
timeout = 120

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures", "scripts"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/cdebt/sandbox.py" = ["E501"]
"src/cdebt/probes/mutation.py" = ["E501"]
"tests/test_sandbox_node.py" = ["E501"]  # JS payload strings
"tests/test_js_probes.py" = ["E501"]  # JS source strings
"tests/test_sandbox_fuzz.py" = ["E501", "F541"]  # payload strings
"tests/test_sandbox_node_fuzz.py" = ["E501", "F541"]
"tests/test_claims.py" = ["E501"]
"src/cdebt/init.py" = ["E501"]  # YAML/TOML templates
"tests/test_sandbox_docker.py" = ["E501"]
"tests/test_secretguard.py" = ["E501"]
"tests/test_agents.py" = ["E501"]  # harness code strings
"tests/_fake_agent.py" = ["E501"]
"tests/test_adaptive.py" = ["E501"]
"tests/test_sandbox_redteam.py" = ["E501", "F541", "E701", "E702"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
[[tool.mypy.overrides]]
module = ["tree_sitter_python.*", "tree_sitter_typescript.*", "tree_sitter.*", "pyarrow.*", "huggingface_hub.*"]
ignore_missing_imports = true
