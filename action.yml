name: cdebt gate
description: Fail a PR when AI-authored changed lines sit in code nobody has verifiably understood.
inputs:
  max-ai-lines: {description: "Allowed AI lines in un-understood units", default: "0"}
  strict-unknown: {description: "Fail on unknown attribution", default: "false"}
  enforce: {description: "Fail the job when the gate fails (default: advisory, comment only)", default: "false"}
  comment: {description: "Post a sticky PR comment and the `cdebt / gate` check run", default: "true"}
  recheck: {description: "Re-execute recorded probes in the sandbox (needs Docker)", default: "true"}
  version: {description: "cdebt version to install (pip spec)", default: "cdebt"}
  python-version: {description: "Python version", default: "3.12"}
  setup-python: {description: "Run actions/setup-python (set false on a self-hosted runner that already has python 3.11+ on PATH)", default: "true"}
runs:
  using: composite
  steps:
    - if: ${{ inputs.setup-python == 'true' }}
      uses: actions/setup-python@v5
      with: {python-version: "${{ inputs.python-version }}"}
    - shell: bash
      run: python -m pip install --quiet "${{ inputs.version }}"
    - shell: bash
      env:
        CDEBT_MAX_AI_LINES: ${{ inputs.max-ai-lines }}
        CDEBT_STRICT_UNKNOWN: ${{ inputs.strict-unknown }}
        CDEBT_ENFORCE: ${{ inputs.enforce }}
        CDEBT_COMMENT: ${{ inputs.comment }}
        CDEBT_RECHECK: ${{ inputs.recheck }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: bash "${{ github.action_path }}/scripts/action_run.sh"
