name: cdebt-gate-local
# TEST workflow: the same job as gate.yml but on a self-hosted runner (label cdebt-local), so the
# real Actions plumbing (PR trigger, /cdebt recheck comment trigger, check run, bot comment) can be
# tested while GitHub-hosted minutes are unavailable. Remove this file when hosted CI works again.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
permissions: {contents: read, pull-requests: write, issues: write, checks: write}
jobs:
  gate-local:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/cdebt recheck') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: [self-hosted, cdebt-local]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
      - name: python venv (this self-hosted Mac has no hostedtoolcache)
        run: |
          /Users/adityakumarsingh/.local/share/uv/python/cpython-3.11.15-macos-aarch64-none/bin/python3.11 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: ./
        env: {PIP_DEFAULT_TIMEOUT: "300", PIP_RETRIES: "10"}  # slow home network to PyPI
        with: {version: ".", comment: "true", recheck: "true", setup-python: "false"}
