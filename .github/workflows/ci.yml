name: ci
# Free-minutes friendly: on every push/PR only the cheap Ubuntu checks run (one Python, Docker
# sandbox, package build). The full matrix (macOS x3 Pythons, Windows, the 20x repeat-suite and the
# macOS/Windows package smoke tests, which cost many more minutes) runs on a manual
# "Run workflow" (workflow_dispatch). Run it before a release.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["3.11","3.12","3.13"]' || '["3.12"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python scripts/check_claims.py README.md docs/LAUNCH_POST.md
      - run: uv run pytest -q
  windows:
    if: github.event_name == 'workflow_dispatch'
    # Windows: everything that does not execute code (map, gate, plan, attribution, store,
    # backtest, caching, study analysis). Probe execution is unsupported there and fails with a
    # clear message (tests/test_windows_message.py); the POSIX-sandbox tests are skipped.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --python 3.12
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q -rs
  docker-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --python 3.12
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: docker pull python:3.11-slim && docker pull node:24-slim
      - run: uv run pytest tests/test_sandbox_docker.py tests/test_sandbox.py tests/test_sandbox_node.py -q -rs
  repeat-suite:
    if: github.event_name == 'workflow_dispatch'
    # Flake gate: the whole suite 20 times in a row on a GitHub-hosted runner (Docker present,
    # so the Docker sandbox tests run too). Any single failure fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --python 3.12
      - run: docker pull python:3.11-slim
      - run: bash scripts/repeat_suite.sh 20
  package:
    # Build sdist + wheel, twine check, then install the wheel in a CLEAN venv and smoke-test it on
    # each OS (nothing is uploaded anywhere).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv build
      - run: uvx twine check dist/*
      - run: python scripts/smoke_install.py "dist/*.whl"
