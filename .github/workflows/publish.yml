name: publish
# Publishes to PyPI when a GitHub Release is published, using PyPI "trusted publishing" (OIDC): no
# token is stored anywhere. Nothing uploads until the maintainer (1) registers this repository and
# workflow as a trusted publisher for the project on pypi.org and (2) publishes a release.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
