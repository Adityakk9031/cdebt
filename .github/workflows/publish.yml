name: publish
# Publishes to PyPI using PyPI "trusted publishing" (OIDC): no token is stored anywhere. It runs
# ONLY when the maintainer starts it by hand (Actions tab -> publish -> Run workflow), and only
# works after the repository and this workflow are registered as a trusted publisher for the project
# on pypi.org. Publishing a GitHub release does NOT upload to PyPI.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
